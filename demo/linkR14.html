 h+="<p>這一筆報名共 <b>"+V.people.length+"</b> 位。請替每一位選一個。選好後按「送出」，會先讓您再確認一次。</p>";
 V.people.forEach(function(p){var s=SEL[p.q];
  if(p.fix){h+="<div class='card'>"+ipHead(p)+"<p>"+ipEsc(V.volTxt||"")+"</p></div>";return}
  if(p.lk){h+="<div class='card'>"+ipHead(p)+"<p class='lk'>已經選好，不能更改</p>"+ipPlan(p)+"</div>";return}
  h+="<div class='card'>"+ipHead(p)+
  "<div class='q'>12/26（六）下午，想怎麼安排？</div>"+D26.map(function(o){return ipOpt(p.q,"d26",o[0],s.d26,o[1],o[2])}).join("");
  if(s.d26==="行程四")h+="<div class='q'>如果江賢二美術館不滿 15 人、沒有成行，改成：</div>"+BK.map(function(o){return ipOpt(p.q,"bk",o[0],s.bk,o[1].replace(/^改成[^（]*/,"").replace(/^（|）$/g,""),"")}).join("");
  if(s.d26==="行程二")h+="<p>12/26 當天就回家，<b>12/27 沒有行程，不用選</b>。</p>";
  else h+="<div class='q'>12/27（日）上午，想去哪裡？（"+D27AT+"）</div>"+D27.map(function(o){return ipOpt(p.q,"d27",o[0],s.d27,o[1],o[2])}).join("");
  h+="</div>"});
 h+="<div class='card'><b>備註／需求（選填，最多 "+(V.noteMax||300)+" 字）</b><textarea class='t' id='note' maxlength='"+(V.noteMax||300)+"' rows='4' autocomplete='off' placeholder='"+ipEsc(V.noteHint||"")+"'>"+ipEsc(NOTE)+"</textarea></div>";
 if(free.length>1)h+="<button class='btn' type='button' data-a='same'>其他人都跟第一位一樣</button>";
 h+="<div id='err' class='err' role='alert'></div><button class='btn pri' type='button' data-a='confirm'>送出</button>";
 $("box").innerHTML=h}
/* ② 確認頁：列出每一位選的（日期與時間）→「← 回上頁修改」（剛選的保留）或「確定送出」 */
function ipConfirm(){SID=ipSid();var miss=[];V.people.forEach(function(p){if(p.fix||p.lk)return;var s=SEL[p.q];if(!s.d26){miss.push(p.nm+" 的 12/26");return}if(s.d26!=="行程二"&&!s.d27)miss.push(p.nm+" 的 12/27")});
 if(miss.length){$("err").textContent="還沒選："+miss.join("、");return}
 var h="<h2>請再確認一次</h2><div class='lockbox'>確定送出後就不能再更改。請看清楚每一位的日期與時間，也請記住。</div>";
 V.people.forEach(function(p){h+="<div class='card'>"+ipHead(p)+(p.lk?"　<span class='lk'>（已經選好）</span>":"");
  h+=p.fix?"<p>"+ipEsc(V.volTxt||"")+"</p>":ipPlan(p.lk?p:SEL[p.q]);h+="</div>"});
 if(String(NOTE).trim())h+="<div class='card'><b>備註／需求</b><p style='white-space:pre-wrap'>"+ipEsc(NOTE)+"</p></div>";
 h+="<div id='err' class='err' role='alert'></div><div class='row2'>"+ipBackB("back2sel","← 回上頁修改")+"<button class='btn pri' type='button' data-a='send'>確定送出</button></div>";
 $("box").innerHTML=h;try{window.scrollTo(0,0)}catch(e){}}
/* ③ 唯讀頁：已經送出（或每一位都選好了）、或寺方設了 itinCloseAt 而且到了（線上選行程結束）；過了 11/15 不算 */
function ipRO(r,mode){var h=ipBackB("back","← 回上頁");
 if(mode==="done")h+="<p><b>已收到，謝謝！</b>以下是您確定送出的行程。</p>";
 if(r.locked)h+="<div class='lockbox'>"+ipLink(r.lockMsg||LOCKMSG)+"</div><p><b>"+(r.dflt?QLINE.replace("送出後，",""):QLINE)+"</b>建議也把這一頁截圖存起來。</p>";
 if(r.ended)h+="<p class='err'>"+ipLink(r.msg||"線上選行程已經結束")+"</p>";
 (r.people||[]).forEach(function(p){h+="<div class='card'>"+ipHead(p)+(p.fix?"<p>"+ipEsc(r.volTxt||"")+"</p>":ipPlan(p))+"</div>"});
 if(r.note)h+="<div class='card'><b>備註／需求</b><p style='white-space:pre-wrap'>"+ipEsc(r.note)+"</p></div>";
 if(r.noteCut)h+="<p class='err'>備註超過字數，後面的字沒有存到。</p>";
 if(mode==="done"&&r.skipped&&r.skipped.length)h+="<p class='err'>沒有存到："+r.skipped.map(function(x){return ipEsc((x.nm||("第 "+x.q+" 位"))+"（"+x.why+"）")}).join("、")+"</p>";
 $("box").innerHTML=h;try{window.scrollTo(0,0)}catch(e){}}
function ipGot(r){if(!r||!r.ok){$("box").innerHTML="<p class='err'>"+ipLink((r&&r.msg)||"讀不到資料，請稍後再試")+"</p>"+(K?ipBackB("back","← 回上頁"):ipEntry());return}
 V=r;SEL={};NOTE=r.note||"";r.people.forEach(function(p){SEL[p.q]={d26:p.d26,d27:p.d27,bk:p.bk}});ipDraw()}
function ipEntry(){if(MODE==="phoneName")return "<p>請輸入報名時填的<b>電話</b>和<b>姓名</b>：</p><input class='t' id='ph' type='tel' inputmode='tel' autocomplete='off' placeholder='電話，例如 0912-345-678'><input class='t' id='nm' autocomplete='off' placeholder='姓名'><button class='btn pri' type='button' data-a='find'>查詢</button>";
 return MODE==="name4"?"<p>請輸入報名時填的<b>姓名</b>與<b>電話後四碼</b>：</p><input class='t' id='nm' autocomplete='off' placeholder='姓名'><input class='t' id='l4' inputmode='numeric' maxlength='4' autocomplete='off' placeholder='電話後四碼'><button class='btn pri' type='button' data-a='find'>查詢</button>"
 :"<p>請輸入報名時填的<b>電話</b>（本人或同行家人的都可以）：</p><input class='t' id='ph' type='tel' inputmode='tel' autocomplete='off' placeholder='例如 0912-345-678'><button class='btn pri' type='button' data-a='find'>查詢</button>"}
function ipAuth(r){if(!r||!r.ok){$("box").innerHTML="<p class='err'>"+ipLink((r&&r.msg)||"查不到")+"</p>"+ipEntry();return}
 REGS=r.regs||[];if(REGS.length===1){ipOpen(0);return}ipPick()}
function ipPick(){$("box").innerHTML=ipBackB("back","← 回上頁")+"<p>這個資料有 "+REGS.length+" 筆報名，請選要看的那一筆：</p>"+REGS.map(function(x,i){return "<button class='btn' type='button' data-a='pick' data-i='"+i+"'>"+ipEsc(x.nm)+" 這一筆（"+x.n+" 位）"+(x.lk?"・已送出":"")+"</button>"}).join("")}
/* 回上頁：選擇頁／唯讀頁 → 有好幾筆就回選哪一筆，否則回查詢頁（電話＋姓名）；查詢的輸入不留（共用裝置不留別人的電話姓名） */
/* 防呆：選擇頁上已經選了、還沒送出就按回上頁 → 先問一次（唯讀頁、確認頁不問） */
function ipDirty(){if(!V||V.locked||V.ended||!$("box")||$("box").innerHTML.indexOf("data-a='confirm'")<0)return false;
 if(String(NOTE||"")!==String(V.note||""))return true;return V.people.some(function(p){var s=SEL[p.q]||{};return !p.fix&&!p.lk&&((s.d26||"")!==(p.d26||"")||(s.d27||"")!==(p.d27||"")||(s.bk||"")!==(p.bk||""))})}
function ipBack(){V=null;SEL={};NOTE="";if(REGS.length>1&&$("box").innerHTML.indexOf("data-a='pick'")<0){ipPick();return}REGS=[];$("box").innerHTML=ipEntry()}
function ipOpen(i){var x=REGS[i];if(!x)return;K=x.k;S=x.s;if(x.view&&x.view.ok){ipGot(x.view);return}$("box").innerHTML="讀取中…";ipRun("publicItinLink",[K,S],ipGot)}
function ipFail(e){$("box").innerHTML="<p class='err'>連線失敗，請稍後再試："+ipEsc(e&&e.message?e.message:String(e))+"</p>"+ipBackB("back","← 回上頁")}
document.addEventListener("input",function(e){var t=e.target;if(t&&t.id==="note")NOTE=t.value});
document.addEventListener("change",function(e){var t=e.target;if(!t||!t.getAttribute("data-f")||!V)return;var s=SEL[t.getAttribute("data-q")];s[t.getAttribute("data-f")]=t.value;
 if(t.getAttribute("data-f")==="d26"){if(t.value==="行程二")s.d27="";if(t.value!=="行程四")s.bk=""}ipDraw()});
document.addEventListener("click",function(e){var b=e.target.closest?e.target.closest("[data-a]"):null;if(!b)return;var a=b.getAttribute("data-a");
 if(a==="find"){var o=MODE==="name4"?{name:$("nm").value.trim(),last4:$("l4").value.replace(/[^0-9]/g,"")}:(MODE==="phoneName"?{phone:$("ph").value,name:$("nm").value.trim()}:{phone:$("ph").value});$("box").innerHTML="讀取中…";ipRun("publicItinAuth",[o],ipAuth);return}
 if(a==="pick"){ipOpen(Number(b.getAttribute("data-i")));return}
 if(a==="back"){if(ipDirty()&&window.confirm&&!window.confirm("剛選的行程還沒有送出，回上頁就不會保留。確定要回上頁嗎？"))return;ipBack();return}
 if(a==="back2sel"){ipDraw();try{window.scrollTo(0,0)}catch(e2){}return}
 if(a==="same"){var fr=V.people.filter(function(p){return !p.fix&&!p.lk}),f0=fr[0];if(!f0)return;var f=SEL[f0.q];fr.forEach(function(p){SEL[p.q]={d26:f.d26,d27:f.d27,bk:f.bk}});ipDraw();return}
 if(a==="confirm"){ipConfirm();return}
 if(a==="send"){var rows=[];V.people.forEach(function(p){if(p.fix||p.lk)return;var s=SEL[p.q];rows.push({q:p.q,d26:s.d26,d27:s.d26==="行程二"?"":s.d27,bk:s.d26==="行程四"?(s.bk||""):""})});
  var bb=document.querySelector("[data-a='back2sel']");b.disabled=true;b.textContent="送出中…";if(bb)bb.disabled=true;
  var undo=function(){b.disabled=false;b.textContent="確定送出";if(bb)bb.disabled=false};
  var ok=function(r){if(r&&r.ok===false&&r.locked&&r.people){V=r;ipRO(r,"");return}
   if(!r||!r.ok){undo();$("err").innerHTML=ipLink((r&&r.msg)||"沒有送出成功，請再按一次");return}V=r;ipRO(r,"done")};
  ipRun("publicItinLinkSave",[{k:K,s:S,rows:rows,note:NOTE,sid:SID}],ok,{send:1,fail:function(){undo();$("err").textContent="現在連不上，選的都還在。請再按一次「確定送出」（不會重複送出）"}})}});
if(K)ipRun("publicItinLink",[K,S],ipGot);else $("box").innerHTML=ipEntry();
</script></body></html>
