function ipGot(r){if(!r||!r.ok){V=null;ipNmTop();$("box").innerHTML="<p class='err'>"+ipLink((r&&r.msg)||"讀不到資料，請稍後再試")+"</p>"+(K?ipBackB("back","← 回上頁"):ipEntry());return}
 V=r;SEL={};NMS={};NMERR={};NMR={};NMO={};NOTE=r.note||"";r.people.forEach(function(p){SEL[p.q]={d26:p.d26,d27:p.d27,bk:p.bk}});ipDraw()}
function ipEntry(){if(MODE==="phoneName")return "<p>請輸入報名時填的<b>電話</b>和<b>姓名</b>：</p><input class='t' id='ph' type='tel' inputmode='tel' autocomplete='off' placeholder='電話，例如 0912-345-678'><input class='t' id='nm' autocomplete='off' placeholder='姓名'><button class='btn pri' type='button' data-a='find'>查詢</button>";
 return MODE==="name4"?"<p>請輸入報名時填的<b>姓名</b>與<b>電話後四碼</b>：</p><input class='t' id='nm' autocomplete='off' placeholder='姓名'><input class='t' id='l4' inputmode='numeric' maxlength='4' autocomplete='off' placeholder='電話後四碼'><button class='btn pri' type='button' data-a='find'>查詢</button>"
 :"<p>請輸入報名時填的<b>電話</b>（本人或同行家人的都可以）：</p><input class='t' id='ph' type='tel' inputmode='tel' autocomplete='off' placeholder='例如 0912-345-678'><button class='btn pri' type='button' data-a='find'>查詢</button>"}
function ipAuth(r){if(!r||!r.ok){$("box").innerHTML="<p class='err'>"+ipLink((r&&r.msg)||"查不到")+"</p>"+ipEntry();return}
 REGS=r.regs||[];if(REGS.length===1){ipOpen(0);return}ipPick()}
function ipPick(){$("box").innerHTML=ipBackB("back","← 回上頁")+"<p>這個資料有 "+REGS.length+" 筆報名，請選要看的那一筆：</p>"+REGS.map(function(x,i){return "<button class='btn' type='button' data-a='pick' data-i='"+i+"'>"+ipEsc(x.nm)+" 這一筆（"+x.n+" 位）"+(x.lk?"・已送出":"")+"</button>"}).join("")}


function ipDirty(){if(V&&!V.ended&&$("box")&&$("box").innerHTML.indexOf("data-a='sendnm'")>=0){for(var mq in NMS)if(NMS.hasOwnProperty(mq)&&String(NMS[mq]||"").trim())return true;for(var rq in NMR)if(NMR.hasOwnProperty(rq)&&NMR[rq])return true;return false}
 if(!V||V.locked||V.ended||!$("box")||$("box").innerHTML.indexOf("data-a='confirm'")<0)return false;
 if(String(NOTE||"")!==String(V.note||""))return true;for(var nq in NMS)if(NMS.hasOwnProperty(nq)&&String(NMS[nq]||"").trim())return true;return V.people.some(function(p){var s=SEL[p.q]||{};return !p.fix&&!p.lk&&((s.d26||"")!==(p.d26||"")||(s.d27||"")!==(p.d27||"")||(s.bk||"")!==(p.bk||""))})}
function ipBack(){V=null;SEL={};NMS={};NMERR={};NMR={};NMO={};NOTE="";ipNmTop();if(REGS.length>1&&$("box").innerHTML.indexOf("data-a='pick'")<0){ipPick();return}REGS=[];$("box").innerHTML=ipEntry()}
function ipOpen(i){var x=REGS[i];if(!x)return;K=x.k;S=x.s;if(x.view&&x.view.ok){ipGot(x.view);return}$("box").innerHTML="讀取中…";ipRun("publicItinLink",[K,S],ipGot)}
function ipFail(e){$("box").innerHTML="<p class='err'>連線失敗，請稍後再試："+ipEsc(e&&e.message?e.message:String(e))+"</p>"+ipBackB("back","← 回上頁")}
document.addEventListener("input",function(e){var t=e.target;if(t&&t.id==="note")NOTE=t.value;if(t&&t.getAttribute&&t.getAttribute("data-po")){var oq=t.getAttribute("data-po");NMO[oq]=t.value;ipNmClr(oq);ipNmTop()}if(t&&t.getAttribute&&t.getAttribute("data-pn")){var pq=t.getAttribute("data-pn");NMS[pq]=t.value;
 if(NMERR[pq]){ipNmClr(pq);if(t.setAttribute)t.setAttribute("aria-invalid","false")}ipNmTop()}});
function ipNmClr(q){if(!NMERR[q])return;delete NMERR[q];var bx=$("nmb"+q),me=$("nme"+q);if(bx)bx.className="nmbox";if(me)me.textContent=""}
document.addEventListener("change",function(e){var t=e.target;if(t&&t.getAttribute&&t.getAttribute("data-pr")&&V){var rq=t.getAttribute("data-pr");NMR[rq]=t.value;var po=$("po"+rq);if(po){po.hidden=t.value!==V.relOther;if(!po.hidden)try{po.focus()}catch(eF){}}ipNmClr(rq);ipNmTop();return}
 if(!t||!t.getAttribute("data-f")||!V)return;var s=SEL[t.getAttribute("data-q")];s[t.getAttribute("data-f")]=t.value;
 if(t.getAttribute("data-f")==="d26"){if(t.value==="行程二"||t.value===NOCOME)s.d27="";if(t.value!=="行程四")s.bk=""}ipDraw()});
document.addEventListener("click",function(e){var b=e.target.closest?e.target.closest("[data-a]"):null;if(!b)return;var a=b.getAttribute("data-a");
 if(a==="find"){var o=MODE==="name4"?{name:$("nm").value.trim(),last4:$("l4").value.replace(/[^0-9]/g,"")}:(MODE==="phoneName"?{phone:$("ph").value,name:$("nm").value.trim()}:{phone:$("ph").value});$("box").innerHTML="讀取中…";ipRun("publicItinAuth",[o],ipAuth);return}
 if(a==="pick"){ipOpen(Number(b.getAttribute("data-i")));return}
 if(a==="back"){if(ipDirty()&&window.confirm&&!window.confirm("剛選的行程還沒有送出，回上頁就不會保留。確定要回上頁嗎？"))return;ipBack();return}
 if(a==="back2sel"){ipDraw();try{window.scrollTo(0,0)}catch(e2){}return}
 if(a==="same"){var fr=V.people.filter(function(p){return !p.fix&&!p.lk}),f0=fr[0];if(!f0)return;var f=SEL[f0.q];fr.forEach(function(p){SEL[p.q]={d26:f.d26,d27:f.d27,bk:f.bk}});ipDraw();return}
 if(a==="confirm"){ipConfirm();return}
 if(a==="gonm"){var L=ipNmLeft();if(!L.length)return;if(!$("pn"+L[0])){if(V.locked||V.ended)ipRO(V,"keep");else ipDraw()}ipNmGo(L[0]);return}
 if(a==="sendnm"){var nms2=[],bq=[],BF={};NMERR={};V.people.forEach(function(p){if(!ipNmOpen(p))return;var v=String(NMS[p.q]||"").trim();if(!v)return;var e=ipNmBad(v),re=ipRelBad(p.q);if(e){NMERR[p.q]=ipNmMsg(p.q,e);bq.push(p.q)}else if(re){NMERR[p.q]=ipNmMsg(p.q,re);BF[p.q]="pr";bq.push(p.q)}else nms2.push({q:p.q,nm:v,rel:String(NMR[p.q]||""),relo:String(NMO[p.q]||"").trim()})});
  
  var L2=ipNmLeft().filter(function(q){return bq.indexOf(q)<0});L2.forEach(function(q){NMERR[q]="第 "+q+" 位同行者還沒寫姓名（要全部寫完才能送出）"});
  if(bq.length||L2.length){var aq=bq.concat(L2).sort(function(x,y){return x-y});ipRO(V,"keep");ipErr((L2.length?"還差第 "+L2.join("、")+" 位同行者的姓名，請全部寫完再一起送出":"")+(L2.length&&bq.length?"；":"")+bq.map(function(q){return NMERR[q]}).join("；"));ipNmGo(aq[0],BF[aq[0]]);return}
  b.disabled=true;b.textContent="送出中…";SID=ipSid();
  var nundo=function(){b.disabled=false;b.textContent="送出補填的姓名"};
  var nok=function(r){if(r&&r.ok===false&&r.nmMiss&&r.nmMiss.length){NMERR={};r.nmMiss.forEach(function(q){NMERR[q]=(r.nmBad&&r.nmBad[q])?ipNmMsg(q,r.nmBad[q]):"第 "+q+" 位同行者還沒寫姓名（要全部寫完才能送出）"});ipRO(V,"keep");ipErr(r.msg||"");ipNmGo(r.nmMiss[0],ipNmF(r.nmBad&&r.nmBad[r.nmMiss[0]]));return}
   if(!r||!r.ok||!r.people){nundo();var ee=$("err");if(ee)ee.innerHTML=ipLink((r&&r.msg)||"沒有送出成功，請再按一次");return}
   V=r;SEL={};NMS={};NMERR={};NMR={};NMO={};r.people.forEach(function(p){SEL[p.q]={d26:p.d26,d27:p.d27,bk:p.bk}});ipRO(r,"nm")},narg={k:K,s:S,rows:[],sid:SID,names:nms2};
  ipRun("publicItinLinkSave",[narg],nok,{send:1,fail:function(){nundo();ipErr("現在連不上，寫的名字都還在。請再按一次「送出補填的姓名」（不會重複記）")}});return}
 if(a==="send"){var rows=[];V.people.forEach(function(p){if(p.fix||p.lk)return;var s=SEL[p.q];rows.push({q:p.q,d26:s.d26,d27:(s.d26==="行程二"||s.d26===NOCOME)?"":s.d27,bk:s.d26==="行程四"?(s.bk||""):""})});
  var bb=document.querySelector("[data-a='back2sel']");b.disabled=true;b.textContent="送出中…";if(bb)bb.disabled=true;
  var undo=function(){b.disabled=false;b.textContent="確定送出";if(bb)bb.disabled=false};
  var ok=function(r){if(r&&r.ok===false&&r.locked&&r.people){V=r;ipRO(r,"");return}
   
   if(r&&r.ok===false&&r.nmMiss&&r.nmMiss.length){NMERR={};r.nmMiss.forEach(function(q){NMERR[q]=ipNmMsg(q,(r.nmBad&&r.nmBad[q])||"")});ipDraw();ipErr(r.msg||"");ipNmGo(r.nmMiss[0],ipNmF(r.nmBad&&r.nmBad[r.nmMiss[0]]));return}
   if(!r||!r.ok){undo();$("err").innerHTML=ipLink((r&&r.msg)||"沒有送出成功，請再按一次");return}V=r;ipRO(r,"done")};
  var names=[];V.people.forEach(function(p){var v=String(NMS[p.q]||"").trim();if(p.ph&&!p.pn&&v)names.push({q:p.q,nm:v,rel:String(NMR[p.q]||""),relo:String(NMO[p.q]||"").trim()})});
  ipRun("publicItinLinkSave",[{k:K,s:S,rows:rows,note:NOTE,sid:SID,names:names}],ok,{send:1,fail:function(){undo();$("err").textContent="現在連不上，選的都還在。請再按一次「確定送出」（不會重複送出）"}})}});
if(K)ipRun("publicItinLink",[K,S],ipGot);else $("box").innerHTML=ipEntry();
</script></body></html>
